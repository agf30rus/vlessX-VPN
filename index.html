<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выберите устройство</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1>Выберите устройство</h1>
        <p class="description">Выберите ваше устройство для настройки подключения</p>
        
        <div class="grid">
            <button class="card">
                <div class="icon">📱</div>
                <span>iPhone/iPad</span>
            </button>
            <button class="card">
                <div class="icon">🤖</div>
                <span>Android</span>
            </button>
            <button class="card">
                <div class="icon">💻</div>
                <span>Windows</span>
            </button>
            <button class="card">
                <div class="icon">🍎</div>
                <span>macOS</span>
            </button>
            <button class="card wide">
                <div class="icon">📺</div>
                <span>Android TV / Apple TV</span>
            </button>
        </div>

        <button class="action-btn">
            Подключить дополнительное устройство
        </button>
    </div>
</body>
</html>
